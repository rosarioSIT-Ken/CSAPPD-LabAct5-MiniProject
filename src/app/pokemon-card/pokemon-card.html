<article class="card" [style.borderTopColor]="pokemon().themeColor">
  <div class="tag" [style.background]="pokemon().themeColor">{{ pokemon().emoji }}</div>

  <h3 class="name" [style.color]="pokemon().themeColor">{{ pokemon().name }}</h3>

  <p><strong>Type:</strong> {{ pokemon().type }}</p>
  <p><strong>Held Item:</strong> {{ pokemon().heldItem }}</p>

  <button type="button" class="btn" [style.background]="pokemon().themeColor" (click)="onToggle()">
    {{ isOpen() ? 'Hide Description' : 'Show Description' }}
  </button>

  @if (isOpen()) {
    <p class="desc" [style.borderLeftColor]="pokemon().themeColor">{{ pokemon().description }}</p>
  }
</article>
